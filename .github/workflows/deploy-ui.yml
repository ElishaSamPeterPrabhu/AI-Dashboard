name: Build UI (deploy via AWS Amplify)

# Amplify Hosting reads amplify.yml when you connect this repo in the AWS Amplify Console.
# This workflow only verifies the production build in CI.

on:
  push:
    branches: [feature/mcp-apps-canvas]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.*"
      - "package.json"
      - "amplify.yml"
      - ".github/workflows/deploy-ui.yml"
  pull_request:
    branches: [feature/mcp-apps-canvas]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build Vite app
        run: npm ci && npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
