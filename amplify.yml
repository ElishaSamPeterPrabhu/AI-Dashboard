version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Set VITE_API_BASE in Amplify Console → Environment variables (CloudFront BFF URL, no trailing slash).
        # Assist embed also passes ?apiBase= from MCP App HTML when VITE_API_BASE is unset.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
